stages:
  - validate
  - release
  - deploy
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"
  RELEASE_BRANCH: main
  LAB_REGISTRY_HOST: registry-gitlab.dungxbuif.com
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_HOST: tcp://docker:2376
  DOCKER_DRIVER: overlay2
  RELAYHUB_DEPLOY_DIR: /opt/apps/relayhub-v1

backend:
  stage: validate
  image: golang:1.27.1-alpine
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GOWORK: "off"
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
  before_script:
    - apk add --no-cache build-base docker-cli git nodejs npm python3
    - docker info
    - npm --prefix web/admin ci
    - npm --prefix web/admin run build
    - npm --prefix web/docs ci
    - npm --prefix web/docs run build
    - cd backend
    - go generate ./web
    - git diff --exit-code -- backend/web web/docs/static/llms-full.txt web/docs/static/skills
  script:
    - go test ./...
    - go test -race ./internal/service ./internal/store/postgres ./internal/httpapi
    - go test -tags=integration ./... -count=1 -timeout=180s
    - go vet ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

go_sdk:
  stage: validate
  image: golang:1.27.1-alpine
  script:
    - cd sdks/go
    - go test ./...
    - go vet ./...
  variables:
    GOWORK: "off"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

rust_v1:
  stage: validate
  image: docker:28.5.1
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache build-base cmake curl git openssl-dev perl pkgconfig
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustc --version
    - docker info
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo test --locked --manifest-path rust/Cargo.toml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

typescript_sdk:
  stage: validate
  image: node:22-bookworm-slim
  script:
    - cd sdks/typescript
    - npm ci
    - npm run typecheck
    - npm test
    - npm run size
    - npm pack --dry-run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

admin:
  stage: validate
  image: node:22-bookworm-slim
  script:
    - cd web/admin
    - npm ci
    - npm run typecheck
    - npm test
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

docs:
  stage: validate
  image: node:22-bookworm-slim
  script:
    - cd web/docs
    - npm ci
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

contracts:
  stage: validate
  image: golang:1.27.1-bookworm
  script:
    - apt-get update
    - apt-get install --no-install-recommends -y nodejs npm python3-pip
    - pip install --break-system-packages jsonschema==4.26.0 openapi-spec-validator==0.9.0
    - cd web/admin
    - npm ci
    - npm run build
    - cd ../../backend
    - python3 scripts/check-docs.py --static
    - go generate ./web
    - git diff --exit-code -- backend/web web/docs/static/llms-full.txt web/docs/static/skills
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release_branch_guard:
  stage: release
  image: alpine/git:2.49.1
  script:
    - test -n "$CI_COMMIT_TAG"
    - git fetch origin "$RELEASE_BRANCH"
    - test "$(git rev-parse "$CI_COMMIT_TAG^{commit}")" = "$CI_COMMIT_SHA"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$RELEASE_BRANCH" || { echo "release tag is not reachable from protected $RELEASE_BRANCH" >&2; exit 1; }
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging)-/'

build_release_image:
  stage: release
  image: docker:28.5.1
  services:
    - name: docker:28.5.1-dind
  needs: [release_branch_guard]
  before_script:
    - test -n "$LAB_REGISTRY_PUSH_USER"
    - test -n "$LAB_REGISTRY_PUSH_PASSWORD"
    - echo "$LAB_REGISTRY_PUSH_PASSWORD" | docker login "$LAB_REGISTRY_HOST" --username "$LAB_REGISTRY_PUSH_USER" --password-stdin
  script:
    - export IMAGE_REPOSITORY="$LAB_REGISTRY_HOST/$CI_PROJECT_PATH/relayhub"
    - export IMAGE="$IMAGE_REPOSITORY:$CI_COMMIT_SHA"
    - docker build --pull --file deploy/production/Dockerfile --tag "$IMAGE" .
    - docker push "$IMAGE"
    - image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
    - test "$image_ref" = "$IMAGE_REPOSITORY@${image_ref##*@}"
    - printf 'RELAYHUB_IMAGE=%s\n' "$image_ref" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
    - if: '$CI_COMMIT_TAG =~ /^(dev|staging)-/'

deploy_prod:
  stage: deploy
  image: alpine:3.22
  needs: [build_release_image]
  when: manual
  allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$RELAYHUB_SWARM_MANAGER_HOST"
    - test -n "$RELAYHUB_SWARM_MANAGER_USER"
    - test -n "$RELAYHUB_SSH_PRIVATE_KEY"
    - test -n "$RELAYHUB_SSH_KNOWN_HOSTS"
    - install -m 700 -d "$HOME/.ssh"
    - printf '%s\n' "$RELAYHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
    - printf '%s\n' "$RELAYHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
    - chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
    - test -n "$LAB_REGISTRY_PULL_USER"
    - test -n "$LAB_REGISTRY_PULL_PASSWORD"
    - export SSH_TARGET="$RELAYHUB_SWARM_MANAGER_USER@$RELAYHUB_SWARM_MANAGER_HOST"
  script:
    - release_dir="$RELAYHUB_DEPLOY_DIR/releases/$CI_COMMIT_SHA"
    - ssh "$SSH_TARGET" "mkdir -p '$release_dir'"
    - scp deploy/production/stack-staging.yaml "$SSH_TARGET:$release_dir/stack.yaml"
    - printf '%s' "$LAB_REGISTRY_PULL_PASSWORD" | ssh "$SSH_TARGET" "docker login '$LAB_REGISTRY_HOST' --username '$LAB_REGISTRY_PULL_USER' --password-stdin"
    - ssh "$SSH_TARGET" "RELAYHUB_IMAGE='$RELAYHUB_IMAGE' docker stack deploy --with-registry-auth --compose-file '$release_dir/stack.yaml' relayhub-v1"
    - ssh "$SSH_TARGET" "docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' relayhub-v1_relayhub | grep -F '$RELAYHUB_IMAGE'"
  environment:
    name: production
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'

verify_prod:
  stage: verify
  image: curlimages/curl:8.16.0
  needs: [deploy_prod]
  script:
    - curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://relayhub.dungxbuif.com/api/v1/openapi.json >/dev/null
    - curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://relayhub.dungxbuif.com/admin/ >/dev/null
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-/'
