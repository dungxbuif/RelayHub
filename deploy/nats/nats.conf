server_name: relayhub-nats
port: 4222
http: 8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 10GB
}

authorization {
  users: [
    {
      user: $RELAYHUB_NATS_USERNAME
      password: $RELAYHUB_NATS_PASSWORD
      permissions: {
        publish: ["rh.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
        subscribe: ["rh.>", "_INBOX.>"]
      }
    }
  ]
}

max_payload: 1MB
write_deadline: "10s"
