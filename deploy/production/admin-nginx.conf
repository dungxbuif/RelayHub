server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json map;
        application/xml xml;
        text/plain txt;
        application/yaml yaml;
        text/markdown md;
        application/zip zip;
        image/svg+xml svg;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = /sdk {
        return 308 /skills/relayhub-integration-v1.zip;
    }

    location = /sdk/relayhub-integration.zip {
        return 308 /skills/relayhub-integration-v1.zip;
    }

    location = /api/open-api-overview {
        return 308 /api/v1;
    }

    location = /api/signature-and-streaming {
        return 308 /security/auth;
    }

    location = /developer/quick-integrate {
        return 308 /integrate/node;
    }

    location = /developer/webhooks {
        return 308 /integrate/webhooks;
    }

    location = /developer/realtime {
        return 308 /integrate/browser;
    }

    location = /developer/realtime-v2 {
        return 308 /integrate/browser;
    }

    location = /developer/queue-v2 {
        return 308 /concepts/delivery;
    }

    location = /developer/skills-tab {
        return 308 /integrate/skills;
    }

    location ^~ /control-panel/ {
        return 308 /admin/;
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
}
