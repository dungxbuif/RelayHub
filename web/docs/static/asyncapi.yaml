asyncapi: 3.0.0
info:
  title: RelayHub WebSocket APIs
  version: 2.0.0
  description: >-
    Public WebSocket contract for durable event delivery and online functions.
    NATS subjects, streams, durable names and sequences are private RelayHub
    implementation details.
servers:
  production:
    host: relayhub.dungxbuif.com
    pathname: /api/v1/stream
    protocol: wss
    description: Same-origin production gateway. Supply the short-lived token in
      the token query parameter and request relayhub.stream.v1 as the WebSocket
      subprotocol.
    security:
      - $ref: '#/components/securitySchemes/streamToken'
  realtime:
    host: relayhub.dungxbuif.com
    pathname: /ws
    protocol: wss
    description: App-isolated online Realtime v2. Supply a capability token and request relayhub.realtime.v2.
    security:
      - $ref: '#/components/securitySchemes/realtimeToken'
channels:
  durableStream:
    address: /api/v1/stream
    description: >-
      One bidirectional session authenticated as one application. Event types
      retain the HTTP publish contract. Successful function results can be any
      valid JSON value, and invocation results must belong to the authenticated
      application and current connection.
    messages:
      clientFrame:
        $ref: '#/components/messages/clientFrame'
      serverFrame:
        $ref: '#/components/messages/serverFrame'
  realtimeV2:
    address: /ws
    description: Bidirectional publish, bounded namespace grants, batch outcomes, ephemeral presence, and TTL/count-bounded broadcast history with rewind. History is reconnect continuity, not durable work delivery.
    messages:
      clientFrame:
        $ref: '#/components/messages/realtimeClientFrame'
      serverFrame:
        $ref: '#/components/messages/realtimeServerFrame'
operations:
  sendClientFrame:
    action: send
    channel:
      $ref: '#/channels/durableStream'
    messages:
      - $ref: '#/channels/durableStream/messages/clientFrame'
  receiveServerFrame:
    action: receive
    channel:
      $ref: '#/channels/durableStream'
    messages:
      - $ref: '#/channels/durableStream/messages/serverFrame'
  sendRealtimeV2Frame:
    action: send
    channel:
      $ref: '#/channels/realtimeV2'
    messages:
      - $ref: '#/channels/realtimeV2/messages/clientFrame'
  receiveRealtimeV2Frame:
    action: receive
    channel:
      $ref: '#/channels/realtimeV2'
    messages:
      - $ref: '#/channels/realtimeV2/messages/serverFrame'
components:
  securitySchemes:
    streamToken:
      type: httpApiKey
      name: token
      in: query
      description: Short-lived app-scoped token containing stream:connect.
    realtimeToken:
      type: httpApiKey
      name: token
      in: query
      description: Short-lived app/client capability token issued with protocol realtime.v2.
  messages:
    clientFrame:
      name: RelayHubStreamClientFrame
      title: Client to RelayHub frame
      contentType: application/json
      payload:
        $ref: ./schemas/stream-client-frame.schema.json
      examples:
        - name: startDefaultConsumer
          payload:
            type: consumer.start
            protocol_version: 1
            consumer: default
            max_in_flight: 16
    serverFrame:
      name: RelayHubStreamServerFrame
      title: RelayHub to client frame
      contentType: application/json
      payload:
        $ref: ./schemas/stream-server-frame.schema.json
      examples:
        - name: ready
          payload:
            type: ready
            protocol_version: 1
            app_id: app_example
            connection_id: conn_example
            heartbeat_interval_ms: 25000
            max_in_flight_limit: 256
    realtimeClientFrame:
      name: RelayHubRealtimeV2ClientFrame
      contentType: application/json
      payload:
        $ref: ./schemas/client-frame-v2.schema.json
    realtimeServerFrame:
      name: RelayHubRealtimeV2ServerFrame
      contentType: application/json
      payload:
        $ref: ./schemas/server-frame-v2.schema.json
x-relayhub-websocket-subprotocol: relayhub.stream.v1
x-relayhub-message-limit-bytes: 65536
x-relayhub-close-codes:
  '4400': protocol_violation
  '4401': authentication_failed
  '4403': forbidden
  '4406': unsupported_version
  '4408': timeout
  '4429': backpressure
  '4503': dependency_unavailable
