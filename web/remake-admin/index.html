<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>RelayHub Workspace</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #182f42; background: #f4f7f9; }
      body { margin: 0; } main { max-width: 68rem; margin: auto; padding: 1.5rem; }
      nav { display: flex; flex-wrap: wrap; gap: 1rem; padding-block: 1rem; }
      section, form, article { background: white; border: 1px solid #c9d4dd; border-radius: .5rem; padding: 1rem; margin-block: 1rem; }
      label { display: block; margin-block: .75rem; } input, select, textarea, button { font: inherit; padding: .5rem; max-width: 100%; box-sizing: border-box; }
      input:not([type=checkbox]), select, textarea { display: block; width: 100%; }
      button { cursor: pointer; margin: .25rem; } button:disabled { cursor: default; }
      a { color: #075b94; } :focus-visible { outline: 3px solid #086fa6; outline-offset: 2px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; } [role=alert] { color: #972727; }
      dialog { max-width: min(36rem, 85vw); border: 2px solid #182f42; border-radius: .5rem; } dialog::backdrop { background: #182f4288; }
      h1, h2, h3, p { overflow-wrap: anywhere; } small { display: block; }
    </style>
  </head>
  <body><div id="root"><p>Loading workspace…</p></div><script type="module" src="/src/App.tsx"></script></body>
</html>
