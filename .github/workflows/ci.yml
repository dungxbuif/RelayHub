name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: relayhub-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # An explicit reachable service forces integration failures rather than skips.
      RELAYHUB_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install contract validators
        run: python -m pip install jsonschema==4.26.0 openapi-spec-validator==0.9.0
      - name: Formatting, vet and unit/race
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Required real Redis integration
        run: |
          python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",6379),timeout=3); s.sendall(b"*1\r\n$4\r\nPING\r\n"); assert s.recv(32)==b"+PONG\r\n"'
          go test -race -tags=integration ./... -count=1 -timeout=180s
      - name: Docs, contracts and negative controls
        run: |
          ./scripts/build-skill.sh --check
          ./scripts/build-llms.sh --check
          python3 scripts/check-docs.py
          ./scripts/check-contracts.sh --self-test
      - name: Image and Compose validation
        run: |
          docker build -t relayhub:release-candidate .
          export RELAYHUB_ADMIN_TOKEN="$(openssl rand -hex 32)"
          export RELAYHUB_SIGNING_SECRET="$(openssl rand -hex 32)"
          export RELAYHUB_REDIS_PASSWORD="$(openssl rand -hex 32)"
          docker compose config --quiet
      - name: End-to-end acceptance
        run: ./scripts/e2e.sh
