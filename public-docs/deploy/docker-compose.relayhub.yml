# Runnable Task 1 stack. The final MVP adds relayhub-worker as the third service
# only after the worker command is implemented.
x-relayhub-planned-mvp:
  services:
    - relayhub-api
    - relayhub-worker
    - relayhub-redis
  note: relayhub-worker is planned and is not runnable in Task 1

services:
  relayhub-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: relayhub:task1
    restart: unless-stopped
    environment:
      RELAYHUB_HTTP_ADDR: ":8080"
      RELAYHUB_REDIS_URL: redis://relayhub-redis:6379/0
      RELAYHUB_ADMIN_TOKEN: "${RELAYHUB_ADMIN_TOKEN:?set RELAYHUB_ADMIN_TOKEN}"
      RELAYHUB_SIGNING_SECRET: "${RELAYHUB_SIGNING_SECRET:?set RELAYHUB_SIGNING_SECRET}"
    depends_on:
      relayhub-redis:
        condition: service_healthy
    ports:
      - "${RELAYHUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - relayhub

  relayhub-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - relayhub-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - relayhub

volumes:
  relayhub-data:

networks:
  relayhub:
    name: relayhub
