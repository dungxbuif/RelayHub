# Runnable API + callback worker + persistent Redis stack.
services:
  relayhub-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: relayhub:local
    command: ["api"]
    restart: unless-stopped
    environment: &relayhub-environment
      RELAYHUB_HTTP_ADDR: ":8080"
      RELAYHUB_WORKER_HTTP_ADDR: ":9090"
      RELAYHUB_REDIS_URL: redis://relayhub-redis:6379/0
      RELAYHUB_REDIS_KEY_PREFIX: "${RELAYHUB_REDIS_KEY_PREFIX:-relayhub}"
      RELAYHUB_ADMIN_TOKEN: "${RELAYHUB_ADMIN_TOKEN:?set RELAYHUB_ADMIN_TOKEN}"
      RELAYHUB_SIGNING_SECRET: "${RELAYHUB_SIGNING_SECRET:?set RELAYHUB_SIGNING_SECRET}"
      RELAYHUB_ALLOW_INSECURE_CALLBACKS: "${RELAYHUB_ALLOW_INSECURE_CALLBACKS:-false}"
      RELAYHUB_CALLBACK_TIMEOUT: "${RELAYHUB_CALLBACK_TIMEOUT:-10s}"
      RELAYHUB_WORKER_RECLAIM_IDLE: "${RELAYHUB_WORKER_RECLAIM_IDLE:-30s}"
      RELAYHUB_WORKER_CONCURRENCY: "${RELAYHUB_WORKER_CONCURRENCY:-8}"
      RELAYHUB_SHUTDOWN_TIMEOUT: "${RELAYHUB_SHUTDOWN_TIMEOUT:-10s}"
    depends_on:
      relayhub-redis:
        condition: service_healthy
    ports:
      - "${RELAYHUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [relayhub]

  relayhub-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: relayhub:local
    command: ["worker"]
    restart: unless-stopped
    environment: *relayhub-environment
    depends_on:
      relayhub-redis:
        condition: service_healthy
    stop_grace_period: 20s
    networks: [relayhub]

  relayhub-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [relayhub-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [relayhub]

volumes:
  relayhub-data:
networks:
  relayhub:
