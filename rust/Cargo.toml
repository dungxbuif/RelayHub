[package]
name = "relayhub"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
futures-util = "0.3"
argon2 = "0.5"
sha2 = "0.10"
async-nats = { version = "0.51", default-features = false, features = ["jetstream", "ring", "server_2_10", "server_2_11", "server_2_12"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process"] }
tracing = "0.1"
toml = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
libc = "0.2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
