# Canonical stack. Public copy is byte-identical; use --project-directory . there.
x-runtime: &runtime
  image: relayhub:local
  build:
    context: .
    dockerfile: Dockerfile
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: "${RELAYHUB_STOP_GRACE_PERIOD:-20s}"
  networks: [relayhub]
  depends_on:
    relayhub-postgres:
      condition: service_healthy
    relayhub-nats:
      condition: service_healthy
    relayhub-redis:
      condition: service_healthy
  environment: &environment
    RELAYHUB_HTTP_ADDR: ":8080"
    RELAYHUB_WORKER_HTTP_ADDR: ":9090"
    RELAYHUB_POSTGRES_URL: "postgres://relayhub:${RELAYHUB_POSTGRES_PASSWORD:?generate RELAYHUB_POSTGRES_PASSWORD}@relayhub-postgres:5432/relayhub?sslmode=disable"
    RELAYHUB_SECRET_ENCRYPTION_KEY: "${RELAYHUB_SECRET_ENCRYPTION_KEY:?generate RELAYHUB_SECRET_ENCRYPTION_KEY}"
    RELAYHUB_NATS_URL: "${RELAYHUB_NATS_URL:-nats://relayhub-nats:4222}"
    RELAYHUB_NATS_USERNAME: "${RELAYHUB_NATS_USERNAME:?set RELAYHUB_NATS_USERNAME}"
    RELAYHUB_NATS_PASSWORD: "${RELAYHUB_NATS_PASSWORD:?generate RELAYHUB_NATS_PASSWORD}"
    RELAYHUB_NATS_CONNECT_TIMEOUT: "${RELAYHUB_NATS_CONNECT_TIMEOUT:-2s}"
    RELAYHUB_NATS_RECONNECT_WAIT: "${RELAYHUB_NATS_RECONNECT_WAIT:-2s}"
    RELAYHUB_NATS_MAX_RECONNECTS: "${RELAYHUB_NATS_MAX_RECONNECTS:--1}"
    RELAYHUB_NATS_DRAIN_TIMEOUT: "${RELAYHUB_NATS_DRAIN_TIMEOUT:-10s}"
    RELAYHUB_NATS_STREAM_MAX_AGE: "${RELAYHUB_NATS_STREAM_MAX_AGE:-168h}"
    RELAYHUB_NATS_DUPLICATE_WINDOW: "${RELAYHUB_NATS_DUPLICATE_WINDOW:-24h}"
    RELAYHUB_NATS_REPLICAS: "${RELAYHUB_NATS_REPLICAS:-1}"
    RELAYHUB_REDIS_MODE: "standalone"
    RELAYHUB_REDIS_ADDRS: "relayhub-redis:6379"
    RELAYHUB_REDIS_USERNAME: ""
    RELAYHUB_REDIS_PASSWORD: "${RELAYHUB_REDIS_PASSWORD:?generate RELAYHUB_REDIS_PASSWORD}"
    RELAYHUB_REDIS_SENTINEL_MASTER: ""
    RELAYHUB_REDIS_DB: "0"
    RELAYHUB_REDIS_TLS: "false"
    RELAYHUB_REDIS_KEY_PREFIX: "${RELAYHUB_REDIS_KEY_PREFIX:-rh}"
    RELAYHUB_REDIS_CONNECT_TIMEOUT: "${RELAYHUB_REDIS_CONNECT_TIMEOUT:-2s}"
    RELAYHUB_REDIS_READ_TIMEOUT: "${RELAYHUB_REDIS_READ_TIMEOUT:-1s}"
    RELAYHUB_REDIS_WRITE_TIMEOUT: "${RELAYHUB_REDIS_WRITE_TIMEOUT:-1s}"
    RELAYHUB_REDIS_POOL_SIZE: "${RELAYHUB_REDIS_POOL_SIZE:-32}"
    RELAYHUB_ADMIN_TOKEN: "${RELAYHUB_ADMIN_TOKEN:?generate RELAYHUB_ADMIN_TOKEN}"
    RELAYHUB_SIGNING_SECRET: "${RELAYHUB_SIGNING_SECRET:?generate RELAYHUB_SIGNING_SECRET}"
    RELAYHUB_ALLOWED_ORIGINS: "${RELAYHUB_ALLOWED_ORIGINS:-}"
    RELAYHUB_EVENT_RETENTION: "${RELAYHUB_EVENT_RETENTION:-168h}"
    RELAYHUB_JOB_RETENTION: "${RELAYHUB_JOB_RETENTION:-168h}"
    RELAYHUB_IDEMPOTENCY_RETENTION: "${RELAYHUB_IDEMPOTENCY_RETENTION:-24h}"
    RELAYHUB_SIGNING_SKEW: "${RELAYHUB_SIGNING_SKEW:-5m}"
    RELAYHUB_SHUTDOWN_TIMEOUT: "${RELAYHUB_SHUTDOWN_TIMEOUT:-10s}"
    RELAYHUB_CALLBACK_TIMEOUT: "${RELAYHUB_CALLBACK_TIMEOUT:-10s}"
    RELAYHUB_WORKER_RECLAIM_IDLE: "${RELAYHUB_WORKER_RECLAIM_IDLE:-30s}"
    RELAYHUB_WORKER_CONCURRENCY: "${RELAYHUB_WORKER_CONCURRENCY:-8}"
    RELAYHUB_ALLOW_INSECURE_CALLBACKS: "${RELAYHUB_ALLOW_INSECURE_CALLBACKS:-false}"
services:
  relayhub-api:
    <<: *runtime
    command: [api]
    ports: ["${RELAYHUB_PORT:-8080}:8080"]
    healthcheck:
      test: [CMD, /relayhub, healthcheck, "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  relayhub-worker:
    <<: *runtime
    command: [worker]
    healthcheck:
      test: [CMD, /relayhub, healthcheck, "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  relayhub-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: relayhub
      POSTGRES_USER: relayhub
      POSTGRES_PASSWORD: "${RELAYHUB_POSTGRES_PASSWORD:?generate RELAYHUB_POSTGRES_PASSWORD}"
    volumes:
      - relayhub-postgres-data:/var/lib/postgresql/data
      - type: tmpfs
        target: /var/run/postgresql
      - type: tmpfs
        target: /tmp
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U relayhub -d relayhub']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [relayhub]
  relayhub-nats:
    image: nats:2.14.5-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RELAYHUB_NATS_USERNAME: "${RELAYHUB_NATS_USERNAME:?set RELAYHUB_NATS_USERNAME}"
      RELAYHUB_NATS_PASSWORD: "${RELAYHUB_NATS_PASSWORD:?generate RELAYHUB_NATS_PASSWORD}"
    command: [-c, /etc/nats/nats.conf]
    volumes:
      - ./backend/deploy/nats/nats.conf:/etc/nats/nats.conf:ro
      - relayhub-nats-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null "http://127.0.0.1:8222/healthz?js-enabled-only=true"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [relayhub]
  relayhub-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    stop_grace_period: 10s
    command: [sh, -c, 'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: "${RELAYHUB_REDIS_PASSWORD:?generate RELAYHUB_REDIS_PASSWORD}"
      REDISCLI_AUTH: "${RELAYHUB_REDIS_PASSWORD:?generate RELAYHUB_REDIS_PASSWORD}"
    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli --raw ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [relayhub]
volumes:
  relayhub-postgres-data: {}
  relayhub-nats-data: {}
networks:
  relayhub: {}
